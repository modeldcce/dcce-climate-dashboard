name: Update Visitor Statistics
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: visitor-stats
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GA4 Data API
        run: python -m pip install 'google-analytics-data>=0.18,<1' 'google-auth>=2,<3'
      - name: Fetch statistics
        env:
          GA4_PROPERTY_ID: '559333414'
          GA4_START_DATE: '2026-10-16'
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: python update_visitor_stats.py
      - name: Commit updated statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visitor_stats.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update GA4 visitor statistics'
            git push
          fi
